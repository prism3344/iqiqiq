                }

            {

                    let html = `

                        <div class="odp">

                                <img src="test1odpb.png">
                            </button> 

                            <button style="width: auto; height: auto; border: 0px; border-radius: 0px;" onclick="bad(${odpid})">
                                <img src="test1odpba.png">
                            </button> 

                            <button style="width: auto; height: auto; border: 0px; border-radius: 0px;" onclick="add_score(${odpid})">
                                <img src="${name}">
                            </button> 

                            <<button style="width: auto; height: auto; border: 0px; border-radius: 0px;" onclick="bad(${odpid})">
                                <img src="test1odpbad.png">
                            </button> 
                        </div>`;

                    reszta.insertAdjacentHTML('beforeend', html);    
                }

                else
                {
                let html = `
                    <h1>Którą opcje wstawisz w "?"</h1>
                    <img src="${normal}">
                    <div class="odp">
                        <button style="width: auto; height: auto; border: 0px; border-radius: 0px;" onclick="add_score(${odpid})">
                            <img src="${name}">
                        </button> 
                        <button style="width: auto; height: auto; border: 0px; border-radius: 0px;"  onclick="bad(${odpid})">
                            <img src="${name}" style="transform: rotate(-90deg)">
                        </button> 
                        <button style="width: auto; height: auto; border: 0px; border-radius: 0px;"  onclick="bad(${odpid})">
                            <img src="${name}" style="transform: rotate(180deg)">
                        </button> 
                        <button style="width: auto; height: auto; border: 0px; border-radius: 0px;"  onclick="bad(${odpid})">
                            <img src="${name}"style="transform: rotate(90deg)">
                        </button>
                    </div>`;

                reszta.insertAdjacentHTML('beforeend', html);
                }
                

            }
            for(let i = 0; i < 2; i++)
            {
                add_odp(`test${i}odp.png`, `test${i}.png`, i);

            }

                let rest = document.getElementById('reszta')
                let zadania = document.getElementById('zadania')
                zadania.innerHTML = '<h1>ZAPAMIĘTAJ TO:</h1>'
                zadania.innerHTML += '<h1>34289abc</h1>'
                setTimeout(() => {
                    zadania.innerHTML = ''
                    rest.style.display = 'flex'
                }, (2000));
            }
